[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vietnam-proxy"
version = "0.1.1"
description = "A simple library to fetch free Vietnam proxies from ProxyScrape"
dependencies = [
    "requests>=2.25.0",
]

[tool.hatch.build.targets.wheel]
packages = ["vn_proxy"]